name: Collect candidate policy sources

on:
  schedule:
    - cron: "17 22 * * *" # 06:17 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect new sources
        run: python scripts/collect_candidates.py
      - name: Save collection ledger
        run: |
          if git diff --quiet -- data/inbox/; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox/
          git commit -m "chore(data): collect cultural policy source leads"
          git push
