name: Collect candidate policy sources
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-source-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect new sources
        run: python3 scripts/collect_candidates.py
      - name: Commit inbox updates
        run: |
          if git diff --quiet -- data/inbox; then
            echo "No new sources"
            exit 0
          fi
          git config user.name "culture-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox/
          git commit -m "chore(data): collect cultural policy sources"
          git push
