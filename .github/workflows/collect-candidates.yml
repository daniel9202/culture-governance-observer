name: Collect source leads (manual backup)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: candidate-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect new sources
        run: python3 scripts/collect_candidates.py
      - name: Open a source-lead review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/source-leads
          delete-branch: true
          commit-message: "chore(data): collect cultural policy source leads"
          title: "待審核：文化政見來源線索"
          body: |
            此 PR 僅包含尚未核實的來源線索，不會直接發布候選人政見。
            請交由 Codex 研究與摘要，將可核實的政見另建資料 PR 後再合併。
          add-paths: data/inbox/
