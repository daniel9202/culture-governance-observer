name: Validate data
on:
  pull_request:
    paths:
      - "data/input/**"
      - "scripts/build_data.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/build_data.py
