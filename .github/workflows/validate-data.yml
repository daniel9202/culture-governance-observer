name: Validate data
on:
  pull_request:
    paths:
      - "data/input/**"
      - "scripts/build_data.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/build_data.py
