name: Publish accepted policy reviews

on:
  # The active publish path is the local Codex automation. Keep this legacy
  # workflow manual-only as an emergency fallback for service-account users.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reviewed-policy-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Read accepted rows and build public data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_REVIEW_SPREADSHEET_ID: 1ulT-xd19TY7TsUcC9jBjvHh30ZuUnSbja3bJp2fNh_k
        run: python scripts/publish_google_reviews.py
      - name: Commit reviewed data
        run: |
          if git diff --quiet -- data/input/ data/*.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input/candidates.csv data/input/civic_policy_calls.csv data/*.json
          git commit -m "feat(data): publish accepted policy reviews"
          git push
