<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工查核｜文化治理觀察站</title><link rel="stylesheet" href="styles.css"><style>.review{max-width:1000px;margin:auto;padding:4rem 5vw}.review-head{display:flex;justify-content:space-between;gap:2rem;align-items:end}.review-card{background:var(--white);border-top:4px solid var(--ink);padding:1.5rem;margin:1rem 0}.review-card h2{margin:.5rem 0}.review-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin:1rem 0}.review button,.download{border:0;padding:.7rem 1rem;font-weight:800;cursor:pointer}.yes{background:var(--lime)}.no{background:#efded8}.active{outline:3px solid var(--ink)}textarea{width:100%;min-height:70px;padding:.6rem;font:inherit}.toolbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:2rem 0}.download{background:var(--ink);color:white;text-decoration:none}.source{font-weight:700}.muted{color:var(--muted)}@media(max-width:760px){.review{padding:2rem 1rem}.review-head{display:block}}</style></head><body><main class="review"><a href="index.html">← 回公開網站</a><div class="review-head"><div><p class="kicker">HUMAN REVIEW</p><h1>人工查核</h1><p>公開頁可檢視、下載與手動提交；從本機啟動檢核頁後，按 Yes／No 會直接更新 CSV、commit 並推送 GitHub。</p><p class="muted" id="sync">公開網站模式：決定暫存在此瀏覽器；請下載 CSV 後手動提交。</p></div><label>資料類型<select id="type"><option value="civic_policy_calls">民間／團體訴求</option><option value="candidate_sources">候選人政見</option></select></label></div><div class="toolbar"><strong id="count"></strong><button class="download" id="download">下載更新後 CSV</button><a class="download" id="github" target="_blank" rel="noopener">到 GitHub 提交</a></div><div id="rows"></div></main><script src="review.js"></script></body></html>
