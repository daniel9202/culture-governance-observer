<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#18322d;--muted:#667772;--paper:#f4f1e8;--card:#fffdf7;--accent:#176b52;--line:#d9ded8;--danger:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:28px;margin:0}.build{font-size:12px;font-weight:500;color:var(--muted)}.hint,.muted{color:var(--muted)}.header-actions,.tabs,.actions,.list-summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:750;cursor:pointer;background:#e4e8e5;color:var(--ink);text-decoration:none}.btn:disabled{opacity:.55}.btn.active,.accept{background:var(--accent);color:#fff}.reject{background:var(--danger);color:#fff}.tabs{margin:20px 0 12px;border-bottom:1px solid var(--line);padding-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.filters{display:grid;grid-template-columns:1fr repeat(4,minmax(125px,180px));gap:10px;margin-bottom:14px}input,select,textarea{width:100%;border:1px solid #bdc9c4;border-radius:8px;background:#fff;padding:9px;font:inherit}.list-summary{justify-content:space-between;margin-bottom:14px}.card{padding:20px;margin-bottom:14px}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{background:#e6eee9;border-radius:999px;padding:3px 9px}.pill.ai{background:#eef0e5}.title{font-size:19px;font-weight:750;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}textarea{min-height:88px}.notice{background:#e5f4ed;color:#135842;padding:10px;border-radius:8px;margin-bottom:12px}.duplicate{color:var(--danger);font-weight:700}.ai-reason summary{cursor:pointer;color:var(--muted);font-weight:700}.split-panel{margin-top:14px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:#f3faf6}.split-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}.more{display:block;margin:18px auto}.hidden{display:none}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:700px){header{display:block}.stats,.filters,.grid{grid-template-columns:1fr}}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.col{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;background:#fff}.col h3,.preview h3{margin:0 0 8px;font-size:15px}.small{font-size:12px}.srctext{white-space:pre-wrap;margin-top:8px;max-height:420px;overflow:auto}.srctext mark{background:#fff0b3}dl{margin:0}dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}dd{margin:0;white-space:pre-wrap;word-break:break-word}dd.changed{background:#eef8f1}.diff{font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}ins{background:#d9f2df;color:#185c2b;text-decoration:none}del{background:#fbe0dc;color:#8f2a20}.bad-quote{background:#fbe0dc;text-decoration:underline dotted}.ok-quote{background:#eef8f1}.ops{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}.ops label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:#fff}.ops input{width:auto;margin-right:4px}.preview{margin-top:12px;border:1px dashed var(--accent);border-radius:10px;padding:12px;background:#f7fbf8}.compare .field{margin-top:8px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header><div><h1>文化治理觀察站｜雲端審核台 <span class="build" id="build"></span></h1><p class="hint" id="hint"></p></div><div class="header-actions"><a class="btn" href="https://culturalpolicywatch.tw/" target="_blank">前往公開前台</a><button class="btn" onclick="load()">重新整理</button></div></header>
<nav class="tabs"><button class="btn active" id="sourcesTab" onclick="setView('sources')">資訊蒐集</button><button class="btn" id="compareTab" onclick="setView('compare')">比對與發布</button></nav>
<section class="stats" id="stats"></section><section class="filters"><input id="query" placeholder="搜尋"><select id="status"></select><select id="city"><option value="all">全部縣市</option></select><select id="manualNoteFilter"><option value="all">全部人工備註</option><option value="backfill">只看事後補審</option></select><select id="sort"><option value="newest">收集時間新→舊</option><option value="oldest">收集時間舊→新</option></select></section>
<div id="message"></div><div class="list-summary"><span id="listCount"></span><strong id="sessionCount">本次已處理 0 筆</strong></div><section id="list" class="loading">正在載入…</section><button class="btn more hidden" id="loadMore" onclick="loadMore()">載入更多</button>
</main><script>
const $=id=>document.getElementById(id),PAGE_SIZE=200,OFFICES=['縣市長','縣轄市長','縣市議員','不適用'];
let view='sources',state={items:[],counts:{},totalFiltered:0,loadedCount:0},sessionProcessed=0,previousQuery='',timer;
const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={all:'全部',pending:'待審核',accepted:'待比對',rejected:'已拒絕',split:'已拆分',published:'已發布（舊流程）',ready_to_write:'待寫入',written:'已寫入',pending_check:'待查',not_included:'不收錄'};
const fields=offset=>({query:$('query').value,status:$('status').value,city:$('city').value,kind:'all',sort:$('sort').value,offset:offset||0,limit:PAGE_SIZE});
const OFFICE_ALIASES={'議員':'縣市議員','市議員':'縣市議員','縣議員':'縣市議員','縣市議員':'縣市議員','直轄市議員':'縣市議員','市議員候選人':'縣市議員','議員候選人':'縣市議員','市長':'縣市長','縣長':'縣市長','縣市長':'縣市長','直轄市長':'縣市長','縣市長候選人':'縣市長','市長候選人':'縣市長','縣轄市長':'縣轄市長','不適用':'不適用','無':'不適用','民間團體':'不適用','公民團體':'不適用'};
// 縣轄市的市長在縣以下，和「縣市長」不同；OFFICE_ALIASES 是整串比對，所以先比對市名（與 Code.gs 同一份清單）。
const COUNTY_CITY_MAYOR=/^(竹北|頭份|苗栗|彰化|員林|南投|斗六|太保|朴子|屏東|宜蘭|花蓮|臺東|台東|馬公)市長(候選人)?$/;
// 舊資料的職務是 AI 自由填的：寫法不同但意思明確的自動對應；對應不到的不要默默丟掉，
// 在下拉裡保留一個顯示原值的提示項，讓審核者看得到 AI 原本寫什麼再決定。
function officeSelect(attr,value,kind){const raw=String(value||'').trim();const mapped=COUNTY_CITY_MAYOR.test(raw)?'縣轄市長':(OFFICE_ALIASES[raw]||'');const selected=mapped||(raw?'':(kind==='民間政策訴求'?'不適用':''));const legacy=raw&&!mapped?'<option value="'+esc(raw)+'" selected>原值：'+esc(raw)+'（請重新選擇）</option>':'';return '<select '+attr+'>'+(legacy||'<option value="">請選擇</option>')+OFFICES.map(x=>'<option'+(x===selected?' selected':'')+'>'+x+'</option>').join('')+'</select>'}
function setView(next){view=next;['sources','compare'].forEach(x=>$(x+'Tab').classList.toggle('active',next===x));$('status').disabled=next!=='compare';$('manualNoteFilter').disabled=next==='compare';if(next==='sources'){$('status').innerHTML='<option value="pending">待審核</option>';$('hint').textContent='確認每則原始來源是不是文化政見；接受後會移到「比對與發布」，不會直接公開。'}else{$('status').innerHTML='<option value="accepted">待比對</option><option value="pending_check">待查</option><option value="ready_to_write">待寫入</option><option value="written">已寫入</option><option value="not_included">不收錄</option>';$('hint').textContent='對照來源原文與本站既有政見，決定寫成什麼、寫進哪一筆。核准後由資料端 AI 照原樣寫入 CSV，再經公測站確認才上線。'}load()}
function load(){$('list').className='loading';$('list').textContent='正在載入…';$('loadMore').classList.add('hidden');const ok=data=>render(data,false),fail=e=>{$('list').className='';$('list').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'};const run=google.script.run.withSuccessHandler(ok).withFailureHandler(fail);if(view==='compare')run.getCompareDashboard(fields(0));else run.getDashboard(fields(0))}
function loadMore(){$('loadMore').disabled=true;google.script.run.withSuccessHandler(data=>{render(data,true);$('loadMore').disabled=false}).withFailureHandler(e=>{$('loadMore').disabled=false;alert(e.message||e)})[view==='compare'?'getCompareDashboard':'getDashboard'](fields(state.loadedCount||0))}
function renderStats(counts){$('stats').innerHTML=Object.entries(counts).map(([k,v])=>'<div class="stat"><span>'+esc(labels[k]||k)+'</span><b>'+v+'</b></div>').join('')}
function render(data,append){if(append){state.items=state.items.concat(data.items);state.loadedCount=(state.loadedCount||0)+data.items.length}else{state=data;state.loadedCount=data.items.length}state.counts=data.counts;state.totalFiltered=data.totalFiltered===undefined?data.items.length:data.totalFiltered;renderStats(state.counts);if(!append){const selected=$('city').value;$('city').innerHTML='<option value="all">全部縣市</option>'+data.cities.map(c=>'<option>'+esc(c)+'</option>').join('');if([...$('city').options].some(o=>o.value===selected))$('city').value=selected;$('list').className='';$('list').innerHTML=data.items.length?data.items.map(view==='compare'?compareCard:sourceCard).join(''):'<div class="empty">這個工作區目前沒有資料。</div>';if(view==='compare')data.items.forEach(x=>bindCompare(x.rowNumber))}else if(data.items.length)$('list').insertAdjacentHTML('beforeend',data.items.map(view==='compare'?compareCard:sourceCard).join(''));if(view==='compare')data.items.forEach(x=>bindCompare(x.rowNumber));updateSummary()}
function updateSummary(){const shown=state.items.length,total=state.totalFiltered||0,label=view==='sources'?'待審核':'符合條件';$('listCount').textContent='顯示 '+shown+'／'+label+' '+total;$('sessionCount').textContent='本次已處理 '+sessionProcessed+' 筆';$('loadMore').classList.toggle('hidden',shown>=total)}
function sourceCard(x){const kind=x['資料類型'],role=kind==='民間政策訴求'?'提出者身分':'職務',actions='<button class="btn reject" onclick="review('+x.rowNumber+',\'rejected\')">拒絕</button><button class="btn" onclick="startSplit('+x.rowNumber+')">拆分候選人</button><button class="btn accept" onclick="review('+x.rowNumber+',\'accepted\')">接受並送比對</button>';return '<article class="card" id="r'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(kind)+'</span><span>'+esc(x['縣市'])+'</span><span>'+esc(x['發布日期'])+'</span><span class="pill ai">AI 分類：'+esc(x['AI分類']||'未分類')+'</span><span class="pill ai">AI 信心：'+esc(x['AI信心分數']||'未提供')+'</span></div><div class="title"><a href="'+esc(x['來源網址'])+'" target="_blank">'+esc(x['來源標題'])+'</a></div>'+((x.urlHits||[]).length?'<div class="duplicate">來源已收錄於 '+x.urlHits.map(esc).join('、')+'</div>':'')+(x['疑似重複']?'<div class="duplicate">疑似重複：'+esc(x['疑似重複'])+'</div>':'')+'<details class="ai-reason"><summary>查看 AI 判斷理由</summary><p>'+esc(x['AI判斷理由']||'未提供')+'</p></details><div class="grid"><div class="field wide"><label>來源初步摘要</label><textarea data-k="summary">'+esc(x['AI摘要'])+'</textarea></div><div class="field"><label>候選人／提出者</label><input data-k="actor" value="'+esc(x['候選人／提出者'])+'"></div><div class="field"><label>'+role+'</label>'+officeSelect('data-k="office"',x['職務'],kind)+'</div><div class="field wide"><label>政策線索</label><textarea data-k="policy">'+esc(x['政策主張／具體訴求'])+'</textarea></div></div><div class="actions">'+actions+'</div></article>'}
// ── 比對與發布 ─────────────────────────────────────────────
const OPS=['新增政見','更新既有資料','只補來源','不收錄','待查'];
const CFIELDS=[['policy_title','政見名稱'],['summary','摘要'],['policy_argument','政策論述'],['concrete_proposals','具體主張（多項用 || 分隔）'],['related_statements','相關發言'],['topics','議題標籤（| 分隔）'],['editor_notes','編輯備註（本站判讀）']];
const cards={};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const norm=t=>String(t||'').replace(/\s+/g,'');
// 字元層級差異：舊→新，新增綠底、刪除紅底刪除線。
function diffHtml(a,b){a=String(a||'');b=String(b||'');if(a===b)return esc(b)||'<span class="muted">（空）</span>';if(!a)return '<ins>'+esc(b)+'</ins>';if(!b)return '<del>'+esc(a)+'</del>';const n=a.length,m=b.length;if(n*m>3e6)return '<del>'+esc(a)+'</del><ins>'+esc(b)+'</ins>';const w=m+1,dp=new Uint16Array((n+1)*w);for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*w+j]=a[i]===b[j]?dp[(i+1)*w+j+1]+1:Math.max(dp[(i+1)*w+j],dp[i*w+j+1]);let i=0,j=0,out='',run='',kind='';const push=(k,c)=>{if(k!==kind){out+=wrap(kind,run);run='';kind=k}run+=c};const wrap=(k,t)=>!t?'':k==='i'?'<ins>'+esc(t)+'</ins>':k==='d'?'<del>'+esc(t)+'</del>':esc(t);while(i<n&&j<m){if(a[i]===b[j]){push('s',a[i]);i++;j++}else if(dp[(i+1)*w+j]>=dp[i*w+j+1]){push('d',a[i]);i++}else{push('i',b[j]);j++}}while(i<n)push('d',a[i++]);while(j<m)push('i',b[j++]);return out+wrap(kind,run)}
// 忠於原文檢查：把建議內容切句，句子（以……分段）都在來源原文裡找得到才算照貼。
function pieces(text){return String(text||'').split(/\|\||(?<=[。；！？\n])/).map(s=>s.trim()).filter(Boolean)}
function quoted(sentence,source){const s=norm(source);return sentence.split(/…+|\.{3,}/).map(norm).filter(f=>f.length>=2).every(f=>s.includes(f))}
function quoteHtml(text,source){return pieces(text).map(p=>quoted(p,source)?'<span class="ok-quote">'+esc(p)+'</span>':'<span class="bad-quote" title="來源原文中找不到這段">'+esc(p)+'</span>').join(' ‖ ')||'<span class="muted">（空）</span>'}
function markSource(source,content){let html=esc(source);const frags=[...new Set(CFIELDS.flatMap(([k])=>pieces(content[k])).flatMap(p=>p.split(/…+/)).map(s=>s.trim()).filter(f=>f.length>=6&&source.includes(f)))].sort((a,b)=>b.length-a.length);frags.forEach(f=>{html=html.split(esc(f)).join('<mark>'+esc(f)+'</mark>')});return html}
function sourceText(x){return x['原文對照']||x['政策主張／具體訴求']||x['AI摘要']||''}
function initCard(x){const c=x.content&&Object.keys(x.content).length?Object.assign({},x.content):{policy_title:x['政見名稱'],summary:x['AI摘要'],policy_argument:x['政策論述'],concrete_proposals:x['政策主張／具體訴求']};const target=x['對應原筆ID']||x.urlHits[0]||(x.existing[0]&&x.existing[0].id)||'';cards[x.rowNumber]={x,content:c,op:x['處理方式']||'',target,reason:x['更正理由']||'',note:''};return cards[x.rowNumber]}
function selectedRecord(st){return st.x.existing.find(r=>r.id===st.target)||null}
function compareCard(x){const st=initCard(x),locked=['written','not_included'].includes(x['審核狀態']);return '<article class="card compare" id="r'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(labels[x['審核狀態']]||x['審核狀態'])+'</span><b>'+esc(x['候選人／提出者'])+'</b><span>'+esc(x['縣市'])+'｜'+esc(normalizeOfficeLabel(x['職務']))+'</span><span>'+esc(x['政黨／提出者類型'])+'</span><span class="pill ai">AI 信心：'+esc(x['AI信心分數']||'未提供')+'</span><span>第 '+x.rowNumber+' 列</span></div>'+(x.urlHits.length?'<div class="duplicate">來源已收錄於 '+x.urlHits.map(esc).join('、')+'</div>':'')+(x['疑似重複']?'<div class="duplicate">疑似重複：'+esc(x['疑似重複'])+'</div>':'')+'<div class="cols"><section class="col"><h3>① 來源原文</h3><div class="muted small">'+esc(x['來源名稱'])+'｜'+esc(x['發布日期'])+'｜<a href="'+esc(x['來源網址'])+'" target="_blank">開啟原頁</a></div><div class="srctext" data-c="source"></div>'+(x['AI判斷理由']?'<details class="ai-reason"><summary>AI 判斷理由與差異說明</summary><p>'+esc(x['AI判斷理由'])+'</p></details>':'')+'</section><section class="col"><h3>② 本站既有相關政見</h3><select data-c="target"'+(locked?' disabled':'')+'><option value="">（無對應）</option>'+x.existing.map(r=>'<option value="'+esc(r.id)+'"'+(r.id===st.target?' selected':'')+'>'+esc((r.policy_title||r.summary||r.concrete_proposals).slice(0,28))+'｜相似 '+r.score+(x.urlHits.includes(r.id)?'｜同網址':'')+'</option>').join('')+'</select><div data-c="existing"></div></section><section class="col"><h3>③ 本次建議寫入內容</h3>'+CFIELDS.map(([k,l])=>'<div class="field"><label>'+l+'</label><textarea data-f="'+k+'" rows="'+(k==='concrete_proposals'?4:2)+'"'+(locked?' readonly':'')+'>'+esc(st.content[k])+'</textarea><div class="diff" data-d="'+k+'"></div></div>').join('')+'</section></div><div class="ops">'+OPS.map(o=>'<label><input type="radio" name="op'+x.rowNumber+'" value="'+o+'"'+(st.op===o?' checked':'')+(locked?' disabled':'')+'>'+o+'</label>').join('')+'</div><div class="grid"><div class="field" data-show="reason"><label>更正理由（寫進 correction_log）</label><input data-c="reason" value="'+esc(st.reason)+'"></div><div class="field" data-show="note"><label data-c="noteLabel">原因</label><input data-c="note"></div></div><div class="preview" data-c="preview"></div><div class="actions">'+(locked?'<span class="muted">此筆已'+esc(labels[x['審核狀態']])+'，僅供檢視。</span>':'<button class="btn" onclick="backToSources('+x.rowNumber+')">退回資訊蒐集</button><button class="btn accept" data-c="approve" onclick="approve('+x.rowNumber+')">核准，送交寫入</button>')+'</div></article>'}
function normalizeOfficeLabel(v){const raw=String(v||'').trim();return COUNTY_CITY_MAYOR.test(raw)?'縣轄市長':(OFFICE_ALIASES[raw]||raw)}
function bindCompare(row){const el=$('r'+row),st=cards[row];el.querySelector('[data-c=target]').addEventListener('change',e=>{st.target=e.target.value;refresh(row)});el.querySelectorAll('textarea[data-f]').forEach(t=>t.addEventListener('input',()=>{st.content[t.dataset.f]=t.value;refresh(row)}));el.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{st.op=r.value;refresh(row)}));el.querySelector('[data-c=reason]').addEventListener('input',e=>{st.reason=e.target.value;refresh(row)});el.querySelector('[data-c=note]').addEventListener('input',e=>{st.note=e.target.value;refresh(row)});refresh(row)}
function appendList(list,item){list=(list||[]).slice();if(item&&!list.includes(item))list.push(item);return list}
function finalPreview(st){const x=st.x,rec=selectedRecord(st),src=x['來源網址'],c=st.content;const row=(k,v,cls)=>'<dt>'+esc(k)+'</dt><dd class="'+(cls||'')+'">'+(v===''||v===undefined?'<span class="muted">（空）</span>':esc(v))+'</dd>';if(st.op==='新增政見')return {ok:CFIELDS.some(([k])=>norm(c[k])),html:'<b>新增一筆</b>（id 由寫入的 AI 產生）<dl>'+row('city',x['縣市'])+row('office',normalizeOfficeLabel(x['職務']))+row('candidate',x['候選人／提出者'])+row('party',x['政黨／提出者類型'])+CFIELDS.map(([k])=>row(k,c[k]||'')).join('')+row('source_url',src)+row('published_date',x['發布日期'])+'</dl>',miss:'至少填政見名稱、摘要或具體主張'};if(st.op==='更新既有資料'){if(!rec)return {ok:false,html:'',miss:'請在 ② 選擇原筆'};const log=today()+'｜'+(st.reason||'（待填更正理由）')+'｜'+src+'｜審核者';return {ok:!!norm(st.reason),html:'<b>更新 '+esc(rec.id)+'</b>（③ 留空的欄位保留原值；id、publish_id 不變）<dl>'+CFIELDS.map(([k])=>row(k,norm(c[k])?c[k]:rec[k],norm(c[k])&&c[k]!==rec[k]?'changed':'')).join('')+row('related_sources（追加後）',appendList(rec.related_sources,src===rec.source_url?'':src).join('；'))+row('correction_log（追加一行）',log,'changed')+'</dl>',miss:'請填更正理由'}}if(st.op==='只補來源'){if(!rec)return {ok:false,html:'',miss:'請在 ② 選擇原筆'};return {ok:true,html:'<b>只補來源到 '+esc(rec.id)+'</b>，其他欄位不變<dl>'+row('related_sources（追加後）',appendList(rec.related_sources,src===rec.source_url?'':src).join('；'),'changed')+'</dl>'}}if(st.op==='不收錄'||st.op==='待查')return {ok:!!norm(st.note),html:'<b>'+st.op+'</b>：不寫入 CSV，原因記在人工備註。',miss:st.op==='待查'?'請寫下待查事項':'請寫下不收錄原因'};return {ok:false,html:'',miss:'請選擇處理方式'}}
function refresh(row){const el=$('r'+row),st=cards[row],rec=selectedRecord(st),src=sourceText(st.x);el.querySelector('[data-c=source]').innerHTML=markSource(src,st.content)||'<span class="muted">（沒有原文）</span>';el.querySelector('[data-c=existing]').innerHTML=rec?'<dl>'+['policy_title','summary','concrete_proposals','topics'].map(k=>'<dt>'+k+'</dt><dd>'+(esc(rec[k])||'<span class="muted">（空）</span>')+'</dd>').join('')+'<dt>source_url／last_verified</dt><dd><a href="'+esc(rec.source_url)+'" target="_blank">'+esc(rec.source_url.slice(0,48))+'</a>｜'+esc(rec.last_verified)+'</dd><dt>correction_log</dt><dd class="small">'+(rec.correction_log.map(esc).join('<br>')||'<span class="muted">（無）</span>')+'</dd></dl><div class="muted small">'+esc(rec.id)+'</div>':'<p class="muted">'+(st.x.existing.length?'未選擇對應政見。':'本站沒有這位候選人的政見。')+'</p>';const compareMode=rec&&st.op!=='新增政見';el.querySelectorAll('[data-d]').forEach(d=>{const k=d.dataset.d;d.innerHTML=compareMode?(norm(st.content[k])?diffHtml(rec[k],st.content[k]):''):(['policy_title','summary','policy_argument','concrete_proposals','related_statements'].includes(k)&&norm(st.content[k])?quoteHtml(st.content[k],src):'')});el.querySelector('[data-show=reason]').hidden=st.op!=='更新既有資料';el.querySelector('[data-show=note]').hidden=!['不收錄','待查'].includes(st.op);el.querySelector('[data-c=noteLabel]').textContent=st.op==='待查'?'待查事項（寫進人工備註）':'不收錄原因（寫進人工備註）';const p=finalPreview(st);el.querySelector('[data-c=preview]').innerHTML='<h3>最後寫入預覽</h3>'+(p.html||'')+(p.ok?'':'<p class="duplicate">'+esc(p.miss)+'</p>');const b=el.querySelector('[data-c=approve]');if(b){b.disabled=!p.ok;b.textContent=['不收錄','待查'].includes(st.op)?'儲存：'+st.op:'核准，送交寫入'}}
function removeCard(row,from,to,msg){state.items=state.items.filter(i=>i.rowNumber!==row);state.totalFiltered=Math.max(0,state.totalFiltered-1);if(state.counts[from]!==undefined)state.counts[from]=Math.max(0,state.counts[from]-1);if(state.counts[to]!==undefined)state.counts[to]++;sessionProcessed++;$('r'+row).remove();renderStats(state.counts);updateSummary();$('message').innerHTML='<div class="notice">'+msg+'</div>';if(!state.items.length)$('list').innerHTML='<div class="empty">這個工作區目前沒有資料。</div>'}
function approve(row){const st=cards[row],el=$('r'+row);if(el.dataset.saving==='true')return;const p={rowNumber:row,sourceUrl:st.x['來源網址'],operation:st.op,targetId:st.op==='新增政見'?'':st.target,reason:st.reason,note:st.note,content:st.op==='只補來源'?{}:st.content};el.dataset.saving='true';el.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(r=>{el.dataset.saving='';if(r.status===st.x['審核狀態']){refresh(row);el.querySelectorAll('button').forEach(b=>b.disabled=false);$('message').innerHTML='<div class="notice">已更新第 '+row+' 列。</div>';return}removeCard(row,st.x['審核狀態'],r.status,'第 '+row+' 列已設為「'+(labels[r.status]||r.status)+'」。')}).withFailureHandler(e=>{el.dataset.saving='';el.querySelectorAll('button').forEach(b=>b.disabled=false);refresh(row);alert(e.message||e)}).saveComparisonDecision(p)}
function backToSources(row){const st=cards[row];google.script.run.withSuccessHandler(()=>removeCard(row,st.x['審核狀態'],'pending','第 '+row+' 列已退回資訊蒐集。')).withFailureHandler(e=>alert(e.message||e)).returnToSources({rowNumber:row,sourceUrl:st.x['來源網址']})}
function review(row,status){const el=$('r'+row),x=state.items.find(i=>i.rowNumber===row);if(!el||!x||el.dataset.saving==='true')return;const p={rowNumber:row,status,sourceUrl:x['來源網址'],summary:el.querySelector('[data-k=summary]').value,category:x['AI分類'],reason:x['AI判斷理由'],confidence:x['AI信心分數'],actor:el.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:el.querySelector('[data-k=office]').value,policy:el.querySelector('[data-k=policy]').value,note:x['人工備註']};el.dataset.saving='true';el.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(()=>{const from=x['審核狀態'];if(status===from){Object.assign(x,{'AI摘要':p.summary,'候選人／提出者':p.actor,'職務':p.office,'政策主張／具體訴求':p.policy});el.dataset.saving='';el.querySelectorAll('button').forEach(b=>b.disabled=false);$('message').innerHTML='<div class="notice">已儲存。</div>';return}state.items=state.items.filter(i=>i.rowNumber!==row);state.totalFiltered=Math.max(0,state.totalFiltered-1);if(state.counts[from]!==undefined)state.counts[from]=Math.max(0,state.counts[from]-1);if(state.counts[status]!==undefined)state.counts[status]++;sessionProcessed++;el.remove();renderStats(state.counts);updateSummary();$('message').innerHTML='<div class="notice">'+(status==='accepted'?'已移至「比對與發布」。':'已儲存。')+'可直接繼續處理下一筆。</div>';if(!state.items.length)$('list').innerHTML='<div class="empty">這個工作區目前沒有資料。</div>'}).withFailureHandler(e=>{el.dataset.saving='';el.querySelectorAll('button').forEach(b=>b.disabled=false);alert(e.message||e)}).saveReview(p)}
function splitMarkup(d){d=d||{};return '<section class="split-item"><div class="grid"><div class="field"><label>候選人／提出者</label><input data-s="actor" value="'+esc(d.actor)+'"></div><div class="field"><label>政黨／提出者類型</label><input data-s="actorType" value="'+esc(d.actorType)+'"></div><div class="field"><label>職務</label>'+officeSelect('data-s="office"',d.office,'')+'</div><div class="field"><label>個別摘要（選填）</label><input data-s="summary" value="'+esc(d.summary)+'"></div><div class="field wide"><label>該候選人的政策線索</label><textarea data-s="policy">'+esc(d.policy)+'</textarea></div></div></section>'}
function addSplitItem(row,data){$('split'+row).querySelector('.split-items').insertAdjacentHTML('beforeend',splitMarkup(data))}
function startSplit(row){const card=$('r'+row);if($('split'+row))return;const x=state.items.find(i=>i.rowNumber===row),panel=document.createElement('section');panel.className='split-panel';panel.id='split'+row;panel.innerHTML='<h3>拆分候選人</h3><p class="muted">每筆共用來源標題與網址，但分別送往整合。</p><div class="split-items"></div><div class="actions"><button class="btn" onclick="addSplitItem('+row+')">增加一位候選人</button><button class="btn accept" onclick="submitSplit('+row+')">建立多筆待整合資料</button></div>';card.querySelector('.actions').before(panel);addSplitItem(row,{actor:card.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:card.querySelector('[data-k=office]').value,summary:card.querySelector('[data-k=summary]').value,policy:card.querySelector('[data-k=policy]').value});addSplitItem(row,{actorType:x['政黨／提出者類型'],office:x['資料類型']==='民間政策訴求'?'不適用':''})}
function submitSplit(row){const x=state.items.find(i=>i.rowNumber===row),items=[...$('split'+row).querySelectorAll('.split-item')].map(el=>({actor:el.querySelector('[data-s=actor]').value,actorType:el.querySelector('[data-s=actorType]').value,office:el.querySelector('[data-s=office]').value,summary:el.querySelector('[data-s=summary]').value,policy:el.querySelector('[data-s=policy]').value}));google.script.run.withSuccessHandler(r=>{$('message').innerHTML='<div class="notice">已拆分為第 '+r.newRows.join('、')+' 列，等待整合。</div>';sessionProcessed++;load()}).withFailureHandler(e=>alert(e.message||e)).splitReview({rowNumber:row,sourceUrl:x['來源網址'],items})}
$('manualNoteFilter').addEventListener('change',()=>{if($('manualNoteFilter').value==='backfill'){previousQuery=$('query').value;$('query').value='事後補審';$('query').disabled=true}else{$('query').value=previousQuery;$('query').disabled=false}load()});
['query','status','city','sort'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(load,220)}));
google.script.run.withSuccessHandler(info=>{let service='';try{service=new URL(info.url).pathname}catch(e){}const page=location.pathname,sType=service.endsWith('/dev')?'dev':service.endsWith('/exec')?'exec':'',pType=page.endsWith('/dev')?'dev':page.endsWith('/exec')?'exec':'',deployment=sType&&sType===pType?(sType==='dev'?'測試部署':'正式部署'):'';$('build').textContent='版本 '+info.build+(deployment?'｜'+deployment:'')}).getBuildInfo();
setView('sources');
</script></body></html>
