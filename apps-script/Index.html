<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#18322d;--muted:#667772;--paper:#f4f1e8;--card:#fffdf7;--accent:#176b52;--line:#d9ded8;--danger:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:28px;margin:0}.hint{color:var(--muted);margin:4px 0}.header-actions{display:flex;gap:8px;align-items:center}.public-link{display:inline-block;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.filters{display:grid;grid-template-columns:1fr repeat(3,minmax(140px,190px));gap:10px;margin-bottom:18px}input,select,textarea{width:100%;border:1px solid #bdc9c4;border-radius:8px;background:white;padding:9px 10px;color:var(--ink);font:inherit}textarea{min-height:90px;resize:vertical}.card{padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #18322d0b;transition:.16s ease}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{background:#e6eee9;border-radius:999px;padding:3px 9px}.duplicate{display:inline-block;margin:8px 0 0;background:#fff0c7;color:#735000;border:1px solid #e2c570;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}.title{font-size:19px;font-weight:750;margin:10px 0}.title a{color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.batchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 18px;padding:12px;background:#e8eee9;border:1px solid var(--line);border-radius:12px}.batch-count{color:var(--muted);margin-right:auto}.selection{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}.selection input{width:auto}.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:750;cursor:pointer}.accept{background:var(--accent);color:white}.reject{background:var(--danger);color:white}.skip{background:#e4e8e5;color:var(--ink)}.empty,.loading{text-align:center;padding:50px;color:var(--muted)}.error{background:#ffe8e4;color:#7b261f;padding:12px;border-radius:8px;margin-bottom:12px}.notice{background:#e5f4ed;color:#135842;padding:10px 12px;border-radius:8px;margin-bottom:12px}.saving{opacity:.45;pointer-events:none;transform:scale(.995)}@media(max-width:760px){header{display:block}.stats{grid-template-columns:1fr 1fr}.filters,.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><header><div><h1>文化治理觀察站｜雲端審核台</h1><p class="hint">AI 先整理，最後決定仍由人工完成；接受後會排入正式發布流程。</p></div><div class="header-actions"><a class="btn skip public-link" href="https://daniel9202.github.io/culture-governance-observer/" target="_blank" rel="noopener">前往公開前台</a><button class="btn skip" onclick="load()">重新整理</button></div></header><section class="stats" id="stats"></section><section class="filters"><input id="query" placeholder="搜尋標題、摘要或提出者"><select id="status"><option value="pending">待審核</option><option value="accepted">已接受</option><option value="rejected">已拒絕</option><option value="published">已發布</option><option value="all">全部</option></select><select id="city"><option value="all">全部縣市</option></select><select id="kind"><option value="all">全部類型</option><option>候選人政見</option><option>民間政策訴求</option></select></section><section class="batchbar" aria-label="批次審核"><label class="selection"><input id="selectAll" type="checkbox" onchange="toggleVisible(this.checked)"> 全選目前顯示</label><span class="batch-count" id="batchCount">尚未選取</span><button class="btn reject" id="batchReject" type="button" onclick="batchSave('rejected')" disabled>批次退回</button><button class="btn accept" id="batchAccept" type="button" onclick="batchSave('accepted')" disabled>批次接受並排入發布</button></section><div id="message"></div><section id="list" class="loading">正在載入審核資料…</section></main><script>
const $=id=>document.getElementById(id);let state={items:[],counts:{}};function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filters(){return{query:$('query').value,status:$('status').value,city:$('city').value,kind:$('kind').value}}function paintStats(){$('stats').innerHTML=[['pending','待審核'],['accepted','已接受'],['rejected','已拒絕'],['published','已發布']].map(([k,n])=>`<div class="stat"><span>${n}</span><b>${state.counts[k]||0}</b></div>`).join('')}function load(){$('list').className='loading';$('list').textContent='正在載入審核資料…';$('message').innerHTML='';google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboard(filters())}function render(data){state=data;paintStats();const selected=$('city').value;$('city').innerHTML='<option value="all">全部縣市</option>'+data.cities.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('');$('list').className='';$('list').innerHTML=data.items.length?data.items.map(card).join(''):'<div class="empty">這個篩選條件下沒有資料。</div>';updateBatchControls()}function card(x){const id='r'+x.rowNumber;return `<article class="card" id="${id}" data-source-url="${esc(x['來源網址'])}"><label class="selection"><input class="select-card" type="checkbox" onchange="updateBatchControls()"> 選取這筆</label><div class="eyebrow"><span class="pill">${esc(x['資料類型'])}</span><span>${esc(x['縣市'])}</span><span>${esc(x['發布日期'])}</span><span>${esc(x['來源名稱'])}</span></div><div class="title"><a href="${esc(x['來源網址'])}" target="_blank">${esc(x['來源標題'])}</a></div>${x['疑似重複']?`<div class="duplicate">疑似重複：${esc(x['疑似重複'])}</div>`:''}<div class="grid"><div class="field wide"><label>AI 摘要</label><textarea data-k="summary">${esc(x['AI摘要'])}</textarea></div><div class="field"><label>分類</label><input data-k="category" value="${esc(x['AI分類'])}"></div><div class="field"><label>信心分數</label><input data-k="confidence" value="${esc(x['AI信心分數'])}"></div><div class="field wide"><label>AI 判斷理由</label><textarea data-k="reason">${esc(x['AI判斷理由'])}</textarea></div><div class="field"><label>候選人／提出者</label><input data-k="actor" value="${esc(x['候選人／提出者'])}"></div><div class="field"><label>政黨／提出者類型</label><input data-k="actorType" value="${esc(x['政黨／提出者類型'])}"></div><div class="field"><label>職務</label><input data-k="office" value="${esc(x['職務'])}"></div><div class="field"><label>人工備註</label><input data-k="note" value="${esc(x['人工備註'])}"></div><div class="field wide"><label>政策主張／具體訴求</label><textarea data-k="policy">${esc(x['政策主張／具體訴求'])}</textarea></div></div><div class="actions"><button class="btn skip" onclick="removeCard(${x.rowNumber})">略過</button><button class="btn reject" onclick="save(${x.rowNumber},'rejected','${esc(x['來源網址'])}')">拒絕</button><button class="btn accept" onclick="save(${x.rowNumber},'accepted','${esc(x['來源網址'])}')">接受並排入發布</button></div></article>`}function selectedCards(){return [...document.querySelectorAll('.select-card:checked')].map(input=>input.closest('.card')).filter(Boolean)}
function updateBatchControls(){const cards=selectedCards(),count=cards.length;$('batchCount').textContent=count?`已選取 ${count} 筆`:'尚未選取';$('batchAccept').disabled=!count;$('batchReject').disabled=!count;const visible=[...document.querySelectorAll('.select-card')];$('selectAll').checked=!!visible.length&&visible.every(input=>input.checked);$('selectAll').indeterminate=count>0&&count<visible.length}
function toggleVisible(checked){document.querySelectorAll('.select-card').forEach(input=>input.checked=checked);updateBatchControls()}
function batchSave(status){const cards=selectedCards();if(!cards.length)return;if(cards.length>50){$('message').innerHTML='<div class="error">一次最多處理 50 筆，請縮小選取範圍。</div>';return}const payload={status,items:cards.map(el=>{const item={rowNumber:Number(el.id.slice(1)),sourceUrl:el.dataset.sourceUrl};el.querySelectorAll('[data-k]').forEach(input=>item[input.dataset.k]=input.value);return item})};cards.forEach(el=>el.classList.add('saving'));google.script.run.withSuccessHandler(result=>{result.rowNumbers.forEach(removeCard);state.counts.pending=Math.max(0,(state.counts.pending||0)-result.rowNumbers.length);state.counts[status]=(state.counts[status]||0)+result.rowNumbers.length;paintStats();$('message').innerHTML=`<div class="notice">已批次${status==='rejected'?'退回':'接受'} ${result.rowNumbers.length} 筆，資料已儲存。</div>`;setTimeout(()=>{$('message').innerHTML=''},2200)}).withFailureHandler(error=>{cards.forEach(el=>el.classList.remove('saving'));fail(error)}).saveReviews(payload)}function save(row,status,url){const el=$('r'+row),payload={rowNumber:row,status,sourceUrl:url};el.querySelectorAll('[data-k]').forEach(i=>payload[i.dataset.k]=i.value);el.classList.add('saving');google.script.run.withSuccessHandler(()=>{removeCard(row);state.counts.pending=Math.max(0,(state.counts.pending||0)-1);state.counts[status]=(state.counts[status]||0)+1;paintStats();$('message').innerHTML=`<div class="notice">已${status==='rejected'?'拒絕':'接受'}，資料已儲存。</div>`;setTimeout(()=>{$('message').innerHTML=''},1800)}).withFailureHandler(e=>{el.classList.remove('saving');fail(e)}).saveReview(payload)}function removeCard(row){const el=$('r'+row);if(el)el.remove();updateBatchControls()}function fail(e){$('message').innerHTML=`<div class="error">${esc(e.message||e)}</div>`;$('list').className=''}let timer;['query','status','city','kind'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(load,250)}));load();
</script></body></html>
