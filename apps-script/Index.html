<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#18322d;--muted:#667772;--paper:#f4f1e8;--card:#fffdf7;--accent:#176b52;--line:#d9ded8;--danger:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:28px;margin:0}.build{font-size:12px;font-weight:500;color:var(--muted)}.hint,.muted{color:var(--muted)}.header-actions,.tabs,.actions,.list-summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:750;cursor:pointer;background:#e4e8e5;color:var(--ink);text-decoration:none}.btn:disabled{opacity:.55}.btn.active,.accept{background:var(--accent);color:#fff}.reject{background:var(--danger);color:#fff}.tabs{margin:20px 0 12px;border-bottom:1px solid var(--line);padding-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.filters{display:grid;grid-template-columns:1fr repeat(4,minmax(125px,180px));gap:10px;margin-bottom:14px}input,select,textarea{width:100%;border:1px solid #bdc9c4;border-radius:8px;background:#fff;padding:9px;font:inherit}.list-summary{justify-content:space-between;margin-bottom:14px}.card{padding:20px;margin-bottom:14px}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{background:#e6eee9;border-radius:999px;padding:3px 9px}.pill.ai{background:#eef0e5}.title{font-size:19px;font-weight:750;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}textarea{min-height:88px}.notice{background:#e5f4ed;color:#135842;padding:10px;border-radius:8px;margin-bottom:12px}.duplicate{color:var(--danger);font-weight:700}.ai-reason summary{cursor:pointer;color:var(--muted);font-weight:700}.split-panel{margin-top:14px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:#f3faf6}.split-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}.more{display:block;margin:18px auto}.hidden{display:none}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:700px){header{display:block}.stats,.filters,.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header><div><h1>文化治理觀察站｜雲端審核台 <span class="build" id="build"></span></h1><p class="hint" id="hint"></p></div><div class="header-actions"><a class="btn" href="https://daniel9202.github.io/culture-governance-observer/" target="_blank">前往公開前台</a><button class="btn" onclick="load()">重新整理</button></div></header>
<nav class="tabs"><button class="btn active" id="sourcesTab" onclick="setView('sources')">資訊蒐集</button><button class="btn" id="prepublishTab" onclick="setView('prepublish')">準備上架</button><button class="btn" id="draftsTab" onclick="setView('drafts')">AI 整合稿</button></nav>
<section class="stats" id="stats"></section><section class="filters"><input id="query" placeholder="搜尋"><select id="status"></select><select id="city"><option value="all">全部縣市</option></select><select id="manualNoteFilter"><option value="all">全部人工備註</option><option value="backfill">只看事後補審</option></select><select id="sort"><option value="newest">收集時間新→舊</option><option value="oldest">收集時間舊→新</option></select></section>
<div id="message"></div><div class="list-summary"><span id="listCount"></span><strong id="sessionCount">本次已處理 0 筆</strong></div><section id="list" class="loading">正在載入…</section><button class="btn more hidden" id="loadMore" onclick="loadMore()">載入更多</button>
</main><script>
const $=id=>document.getElementById(id),PAGE_SIZE=200,OFFICES=['縣市長','縣轄市長','縣市議員','不適用'];
let view='sources',state={items:[],counts:{},totalFiltered:0,loadedCount:0},sessionProcessed=0,previousQuery='',timer;
const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={all:'全部',pending:'待審核',accepted:'準備上架',rejected:'已拒絕',split:'已拆分',draft_ready:'待發布整合稿',rework:'退回重整',published:'已發布'};
const fields=offset=>({query:$('query').value,status:$('status').value,city:$('city').value,kind:'all',sort:$('sort').value,offset:offset||0,limit:PAGE_SIZE});
const OFFICE_ALIASES={'議員':'縣市議員','市議員':'縣市議員','縣議員':'縣市議員','縣市議員':'縣市議員','直轄市議員':'縣市議員','市議員候選人':'縣市議員','議員候選人':'縣市議員','市長':'縣市長','縣長':'縣市長','縣市長':'縣市長','直轄市長':'縣市長','縣市長候選人':'縣市長','市長候選人':'縣市長','縣轄市長':'縣轄市長','不適用':'不適用','無':'不適用','民間團體':'不適用','公民團體':'不適用'};
// 縣轄市的市長在縣以下，和「縣市長」不同；OFFICE_ALIASES 是整串比對，所以先比對市名（與 Code.gs 同一份清單）。
const COUNTY_CITY_MAYOR=/^(竹北|頭份|苗栗|彰化|員林|南投|斗六|太保|朴子|屏東|宜蘭|花蓮|臺東|台東|馬公)市長(候選人)?$/;
// 舊資料的職務是 AI 自由填的：寫法不同但意思明確的自動對應；對應不到的不要默默丟掉，
// 在下拉裡保留一個顯示原值的提示項，讓審核者看得到 AI 原本寫什麼再決定。
function officeSelect(attr,value,kind){const raw=String(value||'').trim();const mapped=COUNTY_CITY_MAYOR.test(raw)?'縣轄市長':(OFFICE_ALIASES[raw]||'');const selected=mapped||(raw?'':(kind==='民間政策訴求'?'不適用':''));const legacy=raw&&!mapped?'<option value="'+esc(raw)+'" selected>原值：'+esc(raw)+'（請重新選擇）</option>':'';return '<select '+attr+'>'+(legacy||'<option value="">請選擇</option>')+OFFICES.map(x=>'<option'+(x===selected?' selected':'')+'>'+x+'</option>').join('')+'</select>'}
function setView(next){view=next;['sources','prepublish','drafts'].forEach(x=>$(x+'Tab').classList.toggle('active',next===x));$('status').disabled=next!=='drafts';$('manualNoteFilter').disabled=next==='drafts';$('sort').disabled=next==='drafts';if(next==='sources'){$('status').innerHTML='<option value="pending">待審核</option>';$('hint').textContent='確認每則原始來源是否值得收錄；接受後會移到「準備上架」，不會直接公開。'}else if(next==='prepublish'){$('status').innerHTML='<option value="accepted">已接受，等待整理與發布</option>';$('hint').textContent='這裡是你已接受或修正完成的資料。可繼續修改；尚未公開，待整合後才會進入 AI 整合稿。'}else{$('status').innerHTML='<option value="draft_ready">待發布整合稿</option><option value="rework">退回重整</option><option value="published">已發布</option><option value="all">全部</option>';$('hint').textContent='檢視依原始內容整理的政策稿與所有來源；只有確認發布才會進入前台流程。'}load()}
function load(){$('list').className='loading';$('list').textContent='正在載入…';$('loadMore').classList.add('hidden');const ok=data=>render(data,false),fail=e=>{$('list').className='';$('list').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'};if(view==='drafts')google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getIntegrationDashboard(fields(0));else google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getDashboard(fields(0))}
function loadMore(){$('loadMore').disabled=true;google.script.run.withSuccessHandler(data=>{render(data,true);$('loadMore').disabled=false}).withFailureHandler(e=>{$('loadMore').disabled=false;alert(e.message||e)}).getDashboard(fields(state.loadedCount||0))}
function renderStats(counts){$('stats').innerHTML=Object.entries(counts).map(([k,v])=>'<div class="stat"><span>'+esc(labels[k]||k)+'</span><b>'+v+'</b></div>').join('')}
function render(data,append){if(append){state.items=state.items.concat(data.items);state.loadedCount=(state.loadedCount||0)+data.items.length}else{state=data;state.loadedCount=data.items.length}state.counts=data.counts;state.totalFiltered=data.totalFiltered===undefined?data.items.length:data.totalFiltered;renderStats(state.counts);if(!append){const selected=$('city').value;$('city').innerHTML='<option value="all">全部縣市</option>'+data.cities.map(c=>'<option>'+esc(c)+'</option>').join('');if([...$('city').options].some(o=>o.value===selected))$('city').value=selected;$('list').className='';$('list').innerHTML=data.items.length?data.items.map(view==='drafts'?draftCard:sourceCard).join(''):'<div class="empty">這個工作區目前沒有資料。</div>'}else if(data.items.length)$('list').insertAdjacentHTML('beforeend',data.items.map(sourceCard).join(''));updateSummary()}
function updateSummary(){const shown=state.items.length,total=state.totalFiltered||0,label=view==='sources'?'待審核':view==='prepublish'?'準備上架':'符合條件';$('listCount').textContent='顯示 '+shown+'／'+label+' '+total;$('sessionCount').textContent='本次已處理 '+sessionProcessed+' 筆';$('loadMore').classList.toggle('hidden',view==='drafts'||shown>=total)}
function sourceCard(x){const kind=x['資料類型'],role=kind==='民間政策訴求'?'提出者身分':'職務',actions=view==='prepublish'?'<button class="btn" onclick="review('+x.rowNumber+',\'pending\')">退回待審核</button><button class="btn accept" onclick="review('+x.rowNumber+',\'accepted\')">儲存準備上架資料</button>':'<button class="btn reject" onclick="review('+x.rowNumber+',\'rejected\')">拒絕</button><button class="btn" onclick="startSplit('+x.rowNumber+')">拆分候選人</button><button class="btn accept" onclick="review('+x.rowNumber+',\'accepted\')">接受並送準備上架</button>';return '<article class="card" id="r'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(kind)+'</span><span>'+esc(x['縣市'])+'</span><span>'+esc(x['發布日期'])+'</span><span class="pill ai">AI 分類：'+esc(x['AI分類']||'未分類')+'</span><span class="pill ai">AI 信心：'+esc(x['AI信心分數']||'未提供')+'</span></div><div class="title"><a href="'+esc(x['來源網址'])+'" target="_blank">'+esc(x['來源標題'])+'</a></div>'+(x['疑似重複']?'<div class="duplicate">疑似重複：'+esc(x['疑似重複'])+'</div>':'')+'<details class="ai-reason"><summary>查看 AI 判斷理由</summary><p>'+esc(x['AI判斷理由']||'未提供')+'</p></details><div class="grid"><div class="field wide"><label>來源初步摘要</label><textarea data-k="summary">'+esc(x['AI摘要'])+'</textarea></div><div class="field"><label>候選人／提出者</label><input data-k="actor" value="'+esc(x['候選人／提出者'])+'"></div><div class="field"><label>'+role+'</label>'+officeSelect('data-k="office"',x['職務'],kind)+'</div><div class="field wide"><label>政策線索</label><textarea data-k="policy">'+esc(x['政策主張／具體訴求'])+'</textarea></div></div><div class="actions">'+actions+'</div></article>'}
function draftCard(x){return '<article class="card" id="d'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(x['草稿狀態'])+'</span><span>'+esc(x['縣市'])+'</span><span>'+esc(x['候選人／提出者'])+'</span></div><div class="title">'+esc(x['政策論述'])+'</div><div class="field"><label>具體主張</label><textarea readonly>'+esc(x['具體主張'])+'</textarea></div><div class="field"><label>相關發言</label><textarea readonly>'+esc(x['相關發言'])+'</textarea></div><div class="field"><label>所有來源與整合依據</label><textarea readonly>'+esc(x['來源清單'])+'\n\n'+esc(x['整合依據'])+'</textarea></div><div class="actions"><button class="btn reject" onclick="decide('+x.rowNumber+',\'rework\',\''+esc(x['草稿ID'])+'\')">退回重整</button><button class="btn accept" onclick="decide('+x.rowNumber+',\'published\',\''+esc(x['草稿ID'])+'\')">確認發布</button></div></article>'}
function review(row,status){const el=$('r'+row),x=state.items.find(i=>i.rowNumber===row);if(!el||!x||el.dataset.saving==='true')return;const p={rowNumber:row,status,sourceUrl:x['來源網址'],summary:el.querySelector('[data-k=summary]').value,category:x['AI分類'],reason:x['AI判斷理由'],confidence:x['AI信心分數'],actor:el.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:el.querySelector('[data-k=office]').value,policy:el.querySelector('[data-k=policy]').value,note:x['人工備註']};el.dataset.saving='true';el.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(()=>{const from=x['審核狀態'];if(status===from){Object.assign(x,{'AI摘要':p.summary,'候選人／提出者':p.actor,'職務':p.office,'政策主張／具體訴求':p.policy});el.dataset.saving='';el.querySelectorAll('button').forEach(b=>b.disabled=false);$('message').innerHTML='<div class="notice">已儲存。</div>';return}state.items=state.items.filter(i=>i.rowNumber!==row);state.totalFiltered=Math.max(0,state.totalFiltered-1);if(state.counts[from]!==undefined)state.counts[from]=Math.max(0,state.counts[from]-1);if(state.counts[status]!==undefined)state.counts[status]++;sessionProcessed++;el.remove();renderStats(state.counts);updateSummary();$('message').innerHTML='<div class="notice">'+(status==='accepted'?'已移至「準備上架」。':'已儲存。')+'可直接繼續處理下一筆。</div>';if(!state.items.length)$('list').innerHTML='<div class="empty">這個工作區目前沒有資料。</div>'}).withFailureHandler(e=>{el.dataset.saving='';el.querySelectorAll('button').forEach(b=>b.disabled=false);alert(e.message||e)}).saveReview(p)}
function splitMarkup(d){d=d||{};return '<section class="split-item"><div class="grid"><div class="field"><label>候選人／提出者</label><input data-s="actor" value="'+esc(d.actor)+'"></div><div class="field"><label>政黨／提出者類型</label><input data-s="actorType" value="'+esc(d.actorType)+'"></div><div class="field"><label>職務</label>'+officeSelect('data-s="office"',d.office,'')+'</div><div class="field"><label>個別摘要（選填）</label><input data-s="summary" value="'+esc(d.summary)+'"></div><div class="field wide"><label>該候選人的政策線索</label><textarea data-s="policy">'+esc(d.policy)+'</textarea></div></div></section>'}
function addSplitItem(row,data){$('split'+row).querySelector('.split-items').insertAdjacentHTML('beforeend',splitMarkup(data))}
function startSplit(row){const card=$('r'+row);if($('split'+row))return;const x=state.items.find(i=>i.rowNumber===row),panel=document.createElement('section');panel.className='split-panel';panel.id='split'+row;panel.innerHTML='<h3>拆分候選人</h3><p class="muted">每筆共用來源標題與網址，但分別送往整合。</p><div class="split-items"></div><div class="actions"><button class="btn" onclick="addSplitItem('+row+')">增加一位候選人</button><button class="btn accept" onclick="submitSplit('+row+')">建立多筆待整合資料</button></div>';card.querySelector('.actions').before(panel);addSplitItem(row,{actor:card.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:card.querySelector('[data-k=office]').value,summary:card.querySelector('[data-k=summary]').value,policy:card.querySelector('[data-k=policy]').value});addSplitItem(row,{actorType:x['政黨／提出者類型'],office:x['資料類型']==='民間政策訴求'?'不適用':''})}
function submitSplit(row){const x=state.items.find(i=>i.rowNumber===row),items=[...$('split'+row).querySelectorAll('.split-item')].map(el=>({actor:el.querySelector('[data-s=actor]').value,actorType:el.querySelector('[data-s=actorType]').value,office:el.querySelector('[data-s=office]').value,summary:el.querySelector('[data-s=summary]').value,policy:el.querySelector('[data-s=policy]').value}));google.script.run.withSuccessHandler(r=>{$('message').innerHTML='<div class="notice">已拆分為第 '+r.newRows.join('、')+' 列，等待整合。</div>';sessionProcessed++;load()}).withFailureHandler(e=>alert(e.message||e)).splitReview({rowNumber:row,sourceUrl:x['來源網址'],items})}
function decide(row,status,draftId){google.script.run.withSuccessHandler(load).withFailureHandler(e=>alert(e.message||e)).saveIntegrationDecision({rowNumber:row,status,draftId})}
$('manualNoteFilter').addEventListener('change',()=>{if($('manualNoteFilter').value==='backfill'){previousQuery=$('query').value;$('query').value='事後補審';$('query').disabled=true}else{$('query').value=previousQuery;$('query').disabled=false}load()});
['query','status','city','sort'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(load,220)}));
google.script.run.withSuccessHandler(info=>{let service='';try{service=new URL(info.url).pathname}catch(e){}const page=location.pathname,sType=service.endsWith('/dev')?'dev':service.endsWith('/exec')?'exec':'',pType=page.endsWith('/dev')?'dev':page.endsWith('/exec')?'exec':'',deployment=sType&&sType===pType?(sType==='dev'?'測試部署':'正式部署'):'';$('build').textContent='版本 '+info.build+(deployment?'｜'+deployment:'')}).getBuildInfo();
setView('sources');
</script></body></html>
