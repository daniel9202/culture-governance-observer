<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#18322d;--muted:#667772;--paper:#f4f1e8;--card:#fffdf7;--accent:#176b52;--line:#d9ded8;--danger:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:28px;margin:0}.hint{color:var(--muted);margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.filters{display:grid;grid-template-columns:1fr repeat(3,minmax(140px,190px));gap:10px;margin-bottom:18px}input,select,textarea{width:100%;border:1px solid #bdc9c4;border-radius:8px;background:white;padding:9px 10px;color:var(--ink);font:inherit}textarea{min-height:90px;resize:vertical}.card{padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #18322d0b}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{background:#e6eee9;border-radius:999px;padding:3px 9px}.title{font-size:19px;font-weight:750;margin:10px 0}.title a{color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:750;cursor:pointer}.accept{background:var(--accent);color:white}.reject{background:var(--danger);color:white}.skip{background:#e4e8e5;color:var(--ink)}.empty,.loading{text-align:center;padding:50px;color:var(--muted)}.error{background:#ffe8e4;color:#7b261f;padding:12px;border-radius:8px;margin-bottom:12px}@media(max-width:760px){header{display:block}.stats{grid-template-columns:1fr 1fr}.filters,.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><header><div><h1>文化治理觀察站｜雲端審核台</h1><p class="hint">AI 先整理，最後決定仍由人工完成；接受後約 15 分鐘內自動上架。</p></div><button class="btn skip" onclick="load()">重新整理</button></header><section class="stats" id="stats"></section><section class="filters"><input id="query" placeholder="搜尋標題、摘要或提出者"><select id="status"><option value="pending">待審核</option><option value="accepted">已接受</option><option value="rejected">已拒絕</option><option value="published">已發布</option><option value="all">全部</option></select><select id="city"><option value="all">全部縣市</option></select><select id="kind"><option value="all">全部類型</option><option>候選人政見</option><option>民間政策訴求</option></select></section><div id="message"></div><section id="list" class="loading">正在載入審核資料…</section></main><script>
const $=id=>document.getElementById(id);let state={items:[]};function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filters(){return{query:$('query').value,status:$('status').value,city:$('city').value,kind:$('kind').value}}function load(){$('list').className='loading';$('list').textContent='正在載入審核資料…';$('message').innerHTML='';google.script.run.withSuccessHandler(render).withFailureHandler(fail).getDashboard(filters())}function render(data){state=data;$('stats').innerHTML=[['pending','待審核'],['accepted','已接受'],['rejected','已拒絕'],['published','已發布']].map(([k,n])=>`<div class="stat"><span>${n}</span><b>${data.counts[k]||0}</b></div>`).join('');const selected=$('city').value;$('city').innerHTML='<option value="all">全部縣市</option>'+data.cities.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('');$('list').className='';$('list').innerHTML=data.items.length?data.items.map(card).join(''):'<div class="empty">這個篩選條件下沒有資料。</div>'}function card(x){const id='r'+x.rowNumber;return `<article class="card" id="${id}"><div class="eyebrow"><span class="pill">${esc(x['資料類型'])}</span><span>${esc(x['縣市'])}</span><span>${esc(x['發布日期'])}</span><span>${esc(x['來源名稱'])}</span></div><div class="title"><a href="${esc(x['來源網址'])}" target="_blank">${esc(x['來源標題'])}</a></div><div class="grid"><div class="field wide"><label>AI 摘要</label><textarea data-k="summary">${esc(x['AI摘要'])}</textarea></div><div class="field"><label>分類</label><input data-k="category" value="${esc(x['AI分類'])}"></div><div class="field"><label>信心分數</label><input data-k="confidence" value="${esc(x['AI信心分數'])}"></div><div class="field wide"><label>AI 判斷理由</label><textarea data-k="reason">${esc(x['AI判斷理由'])}</textarea></div><div class="field"><label>候選人／提出者</label><input data-k="actor" value="${esc(x['候選人／提出者'])}"></div><div class="field"><label>政黨／提出者類型</label><input data-k="actorType" value="${esc(x['政黨／提出者類型'])}"></div><div class="field"><label>職務</label><input data-k="office" value="${esc(x['職務'])}"></div><div class="field"><label>人工備註</label><input data-k="note" value="${esc(x['人工備註'])}"></div><div class="field wide"><label>政策主張／具體訴求</label><textarea data-k="policy">${esc(x['政策主張／具體訴求'])}</textarea></div></div><div class="actions"><button class="btn skip" onclick="removeCard(${x.rowNumber})">略過</button><button class="btn reject" onclick="save(${x.rowNumber},'rejected','${esc(x['來源網址'])}')">拒絕</button><button class="btn accept" onclick="save(${x.rowNumber},'accepted','${esc(x['來源網址'])}')">接受並排入發布</button></div></article>`}function save(row,status,url){const el=$('r'+row),payload={rowNumber:row,status,sourceUrl:url};el.querySelectorAll('[data-k]').forEach(i=>payload[i.dataset.k]=i.value);el.style.opacity=.45;google.script.run.withSuccessHandler(()=>{removeCard(row);load()}).withFailureHandler(e=>{el.style.opacity=1;fail(e)}).saveReview(payload)}function removeCard(row){const el=$('r'+row);if(el)el.remove()}function fail(e){$('message').innerHTML=`<div class="error">${esc(e.message||e)}</div>`;$('list').className=''}let timer;['query','status','city','kind'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{clearTimeout(timer);timer=setTimeout(load,250)}));load();
</script></body></html>
