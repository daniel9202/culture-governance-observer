<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--ink:#18322d;--muted:#667772;--paper:#f4f1e8;--card:#fffdf7;--accent:#176b52;--line:#d9ded8;--danger:#a33c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:28px;margin:0}.hint,.muted{color:var(--muted)}.header-actions,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:750;cursor:pointer;background:#e4e8e5;color:var(--ink);text-decoration:none}.btn.active,.accept{background:var(--accent);color:#fff}.reject{background:var(--danger);color:#fff}.tabs{margin:20px 0 12px;border-bottom:1px solid var(--line);padding-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat b{display:block;font-size:24px}.filters{display:grid;grid-template-columns:1fr repeat(2,minmax(140px,190px));gap:10px;margin-bottom:18px}input,select,textarea{width:100%;border:1px solid #bdc9c4;border-radius:8px;background:#fff;padding:9px;font:inherit}.card{padding:20px;margin-bottom:14px}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{background:#e6eee9;border-radius:999px;padding:3px 9px}.title{font-size:19px;font-weight:750;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}textarea{min-height:88px}.notice{background:#e5f4ed;color:#135842;padding:10px;border-radius:8px}.split-panel{margin-top:14px;padding:14px;border:1px dashed var(--accent);border-radius:10px;background:#f3faf6}.split-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.split-item:first-child{border-top:0;padding-top:0;margin-top:0}.split-panel h3{margin:0 0 4px}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}@media(max-width:700px){header{display:block}.stats,.filters,.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="shell"><header><div><h1>文化治理觀察站｜雲端審核台</h1><p class="hint" id="hint"></p></div><div class="header-actions"><a class="btn" href="https://daniel9202.github.io/culture-governance-observer/" target="_blank">前往公開前台</a><button class="btn" onclick="load()">重新整理</button></div></header><nav class="tabs"><button class="btn active" id="sourcesTab" onclick="setView('sources')">資訊蒐集</button><button class="btn" id="draftsTab" onclick="setView('drafts')">AI 整合稿</button></nav><section class="stats" id="stats"></section><section class="filters"><input id="query" placeholder="搜尋"><select id="status"></select><select id="city"><option value="all">全部縣市</option></select></section><div id="message"></div><section id="list" class="loading">正在載入…</section></main><script>const $=id=>document.getElementById(id);let view='sources',state={};const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fields=()=>({query:$('query').value,status:$('status').value,city:$('city').value,kind:'all'});function setView(next){view=next;$('sourcesTab').classList.toggle('active',next==='sources');$('draftsTab').classList.toggle('active',next==='drafts');$('status').innerHTML=next==='sources'?'<option value="pending">待審核</option><option value="accepted">待整合</option><option value="rejected">已拒絕</option><option value="published">已發布</option><option value="all">全部</option>':'<option value="draft_ready">待發布整合稿</option><option value="rework">退回重整</option><option value="published">已發布</option><option value="all">全部</option>';$('hint').textContent=next==='sources'?'確認每則原始來源是否值得收錄；接受後進入待整合，不會直接公開。':'檢視 AI 依原始內容整理的政策稿與所有來源；只有確認發布才會進入前台流程。';load()}function load(){$('list').className='loading';$('list').textContent='正在載入…';const done=data=>render(data);const fail=e=>{$('list').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'};if(view==='sources')google.script.run.withSuccessHandler(done).withFailureHandler(fail).getDashboard(fields());else google.script.run.withSuccessHandler(done).withFailureHandler(fail).getIntegrationDashboard(fields())}function render(data){state=data;$('stats').innerHTML=Object.entries(data.counts).map(([k,v])=>'<div class="stat"><span>'+esc({pending:'待審核',accepted:'待整合',rejected:'已拒絕',split:'已拆分',draft_ready:'待發布整合稿',rework:'退回重整',published:'已發布'}[k]||k)+'</span><b>'+v+'</b></div>').join('');$('city').innerHTML='<option value="all">全部縣市</option>'+data.cities.map(c=>'<option>'+esc(c)+'</option>').join('');$('list').className='';$('list').innerHTML=data.items.length?data.items.map(view==='sources'?sourceCard:draftCard).join(''):'<div class="empty">這個工作區目前沒有資料。</div>'}function sourceCard(x){return '<article class="card" id="r'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(x['資料類型'])+'</span><span>'+esc(x['縣市'])+'</span><span>'+esc(x['發布日期'])+'</span></div><div class="title"><a href="'+esc(x['來源網址'])+'" target="_blank">'+esc(x['來源標題'])+'</a></div><div class="grid"><div class="field wide"><label>來源初步摘要</label><textarea data-k="summary">'+esc(x['AI摘要'])+'</textarea></div><div class="field"><label>候選人／提出者</label><input data-k="actor" value="'+esc(x['候選人／提出者'])+'"></div><div class="field"><label>職務</label><input data-k="office" value="'+esc(x['職務'])+'"></div><div class="field wide"><label>政策線索</label><textarea data-k="policy">'+esc(x['政策主張／具體訴求'])+'</textarea></div></div><div class="actions"><button class="btn reject" onclick="review('+x.rowNumber+',\'rejected\')">拒絕</button><button class="btn" onclick="startSplit('+x.rowNumber+')">拆分候選人</button><button class="btn accept" onclick="review('+x.rowNumber+',\'accepted\')">接受並送整合</button></div></article>'}function draftCard(x){return '<article class="card" id="d'+x.rowNumber+'"><div class="eyebrow"><span class="pill">'+esc(x['草稿狀態'])+'</span><span>'+esc(x['縣市'])+'</span><span>'+esc(x['候選人／提出者'])+'</span></div><div class="title">'+esc(x['政策論述'])+'</div><div class="field"><label>具體主張</label><textarea readonly>'+esc(x['具體主張'])+'</textarea></div><div class="field"><label>相關發言</label><textarea readonly>'+esc(x['相關發言'])+'</textarea></div><div class="field"><label>所有來源與整合依據</label><textarea readonly>'+esc(x['來源清單'])+'\n\n'+esc(x['整合依據'])+'</textarea></div><div class="actions"><button class="btn reject" onclick="decide('+x.rowNumber+',\'rework\',\''+esc(x['草稿ID'])+'\')">退回重整</button><button class="btn accept" onclick="decide('+x.rowNumber+',\'published\',\''+esc(x['草稿ID'])+'\')">確認發布</button></div></article>'}function review(row,status){const el=$('r'+row),x=state.items.find(item=>item.rowNumber===row),p={rowNumber:row,status,sourceUrl:x['來源網址'],summary:el.querySelector('[data-k=summary]').value,category:x['AI分類'],reason:x['AI判斷理由'],confidence:x['AI信心分數'],actor:el.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:el.querySelector('[data-k=office]').value,policy:el.querySelector('[data-k=policy]').value,note:x['人工備註']};google.script.run.withSuccessHandler(load).withFailureHandler(e=>alert(e.message||e)).saveReview(p)}function splitItemMarkup(data){return '<section class="split-item"><div class="grid"><div class="field"><label>候選人／提出者</label><input data-s="actor" value="'+esc(data.actor||'')+'"></div><div class="field"><label>政黨／提出者類型</label><input data-s="actorType" value="'+esc(data.actorType||'')+'"></div><div class="field"><label>職務</label><input data-s="office" value="'+esc(data.office||'縣市長')+'"></div><div class="field"><label>個別摘要（選填）</label><input data-s="summary" value="'+esc(data.summary||'')+'"></div><div class="field wide"><label>該候選人的政策線索</label><textarea data-s="policy">'+esc(data.policy||'')+'</textarea></div></div></section>'}function addSplitItem(row,data){const panel=$('split'+row);panel.querySelector('.split-items').insertAdjacentHTML('beforeend',splitItemMarkup(data||{}))}function startSplit(row){const card=$('r'+row);if($('split'+row))return;const x=state.items.find(item=>item.rowNumber===row),actor=card.querySelector('[data-k=actor]').value,office=card.querySelector('[data-k=office]').value,summary=card.querySelector('[data-k=summary]').value,policy=card.querySelector('[data-k=policy]').value;const panel=document.createElement('section');panel.className='split-panel';panel.id='split'+row;panel.innerHTML='<h3>拆分候選人</h3><p class="muted">每筆會共用目前這張卡的來源標題與網址，但以各自的候選人和政策內容送往整合。</p><div class="split-items"></div><div class="actions"><button class="btn" onclick="addSplitItem('+row+')">增加一位候選人</button><button class="btn accept" onclick="submitSplit('+row+')">建立多筆待整合資料</button></div>';card.querySelector('.actions').before(panel);addSplitItem(row,{actor,actorType:x['政黨／提出者類型'],office,summary,policy});addSplitItem(row,{office,actorType:x['政黨／提出者類型']})}function submitSplit(row){const card=$('r'+row),x=state.items.find(item=>item.rowNumber===row),panel=$('split'+row),items=[...panel.querySelectorAll('.split-item')].map(item=>({actor:item.querySelector('[data-s=actor]').value,actorType:item.querySelector('[data-s=actorType]').value,office:item.querySelector('[data-s=office]').value,summary:item.querySelector('[data-s=summary]').value,policy:item.querySelector('[data-s=policy]').value}));google.script.run.withSuccessHandler(result=>{message.innerHTML='<div class="notice">已拆分為第 '+result.newRows.join('、')+' 列，等待整合。</div>';load()}).withFailureHandler(e=>alert(e.message||e)).splitReview({rowNumber:row,sourceUrl:x['來源網址'],items})}
function decide(row,status,draftId){google.script.run.withSuccessHandler(load).withFailureHandler(e=>alert(e.message||e)).saveIntegrationDecision({rowNumber:row,status,draftId})}let t;['query','status','city'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{clearTimeout(t);t=setTimeout(load,220)}));setView('sources');</script></body></html><script>
/* 將已接受資料獨立為「準備上架」工作區；公開發布仍須經整合稿確認。 */
const legacySourceCard = window.sourceCard;
const prepTab = document.createElement('button');
prepTab.className = 'btn'; prepTab.id = 'prepublishTab'; prepTab.textContent = '準備上架';
prepTab.onclick = () => setView('prepublish');
$('draftsTab').before(prepTab);

window.setView = function(next) {
  view = next;
  $('sourcesTab').classList.toggle('active', next === 'sources');
  $('prepublishTab').classList.toggle('active', next === 'prepublish');
  $('draftsTab').classList.toggle('active', next === 'drafts');
  const status = $('status'); status.disabled = false;
  if (next === 'sources') {
    status.innerHTML = '<option value="pending">待審核</option><option value="rejected">已拒絕</option><option value="split">已拆分</option><option value="published">已發布</option><option value="all">全部原始資料</option>';
    $('hint').textContent = '確認每則原始來源是否值得收錄；接受後會移到「準備上架」，不會直接公開。';
  } else if (next === 'prepublish') {
    status.innerHTML = '<option value="accepted">已接受，等待整理與發布</option>'; status.disabled = true;
    $('hint').textContent = '這裡是你已接受或修正完成的資料。可繼續修改；尚未公開，待整合後才會進入 AI 整合稿。';
  } else {
    status.innerHTML = '<option value="draft_ready">待發布整合稿</option><option value="rework">退回重整</option><option value="published">已發布</option><option value="all">全部</option>';
    $('hint').textContent = '檢視依原始內容整理的政策稿與所有來源；只有確認發布才會進入前台流程。';
  }
  load();
};
window.load = function() {
  $('list').className = 'loading'; $('list').textContent = '正在載入…';
  const done = data => render(data), fail = e => { $('list').innerHTML = '<div class="empty">' + esc(e.message || e) + '</div>'; };
  if (view === 'drafts') google.script.run.withSuccessHandler(done).withFailureHandler(fail).getIntegrationDashboard(fields());
  else google.script.run.withSuccessHandler(done).withFailureHandler(fail).getDashboard(fields());
};
window.sourceCard = function(x) {
  const base = legacySourceCard(x).replace('接受並送整合', '接受並送準備上架');
  if (view !== 'prepublish') return base;
  return base.replace(/<div class="actions">[\s\S]*?<\/div><\/article>$/, '<div class="actions"><button class="btn" onclick="review(' + x.rowNumber + ',\'pending\')">退回待審核</button><button class="btn accept" onclick="review(' + x.rowNumber + ',\'accepted\')">儲存準備上架資料</button></div></article>');
};
window.review = function(row, status) {
  const el = $('r' + row), x = state.items.find(item => item.rowNumber === row);
  const p = {rowNumber:row,status,sourceUrl:x['來源網址'],summary:el.querySelector('[data-k=summary]').value,category:x['AI分類'],reason:x['AI判斷理由'],confidence:x['AI信心分數'],actor:el.querySelector('[data-k=actor]').value,actorType:x['政黨／提出者類型'],office:el.querySelector('[data-k=office]').value,policy:el.querySelector('[data-k=policy]').value,note:x['人工備註']};
  google.script.run.withSuccessHandler(() => {
    if (status === 'accepted' && view === 'sources') { $('message').innerHTML = '<div class="notice">已移至「準備上架」。它尚未公開，會先整理成整合稿再發布。</div>'; setView('prepublish'); }
    else { $('message').innerHTML = '<div class="notice">已儲存。</div>'; load(); }
  }).withFailureHandler(e => alert(e.message || e)).saveReview(p);
};
setView('sources');
</script>
<script>
window.render = function(data) {
  state = data;
  $('stats').innerHTML = Object.entries(data.counts).map(([k,v]) => '<div class="stat"><span>' + esc({pending:'待審核',accepted:'準備上架',rejected:'已拒絕',split:'已拆分',draft_ready:'待發布整合稿',rework:'退回重整',published:'已發布'}[k] || k) + '</span><b>' + v + '</b></div>').join('');
  $('city').innerHTML = '<option value="all">全部縣市</option>' + data.cities.map(c => '<option>' + esc(c) + '</option>').join('');
  $('list').className = '';
  $('list').innerHTML = data.items.length ? data.items.map(view === 'drafts' ? draftCard : sourceCard).join('') : '<div class="empty">這個工作區目前沒有資料。</div>';
};
setView('sources');
</script>
